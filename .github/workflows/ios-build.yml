name: Build IPA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 定位工程
        run: |
          set -e
          P=$(find . -maxdepth 4 -name "*.xcodeproj" -type d | head -n 1)
          echo "工程：$P"
          echo "PROJECT_PATH=$P" >> "$GITHUB_ENV"

      - name: 编译
        run: |
          xcodebuild build -project "$PROJECT_PATH" -scheme HobbyPlanet \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO | tail -20

      - name: 打包未签名 IPA
        run: |
          set -o pipefail
          xcodebuild archive -project "$PROJECT_PATH" -scheme HobbyPlanet \
            -destination 'generic/platform=iOS' -archivePath build/HobbyPlanet.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO | tail -20
          mkdir -p build/Payload
          cp -R build/HobbyPlanet.xcarchive/Products/Applications/HobbyPlanet.app build/Payload/
          ( cd build && zip -qry HobbyPlanet-unsigned.ipa Payload )
          ls -lh build/HobbyPlanet-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: HobbyPlanet-ipa
          path: build/HobbyPlanet-unsigned.ipa
          retention-days: 14
